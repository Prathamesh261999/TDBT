version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension containing customer attributes,
      signup information, lifetime order metrics, and loyalty segmentation.
    config:
      contract:
        enforced: true

    columns:
      - name: customer_id
        description: Unique identifier for each customer
        data_type: bigint
        tests:
          - not_null
          - unique

      - name: first_name
        description: Customer first name
        data_type: varchar

      - name: last_name
        description: Customer last name
        data_type: varchar

      - name: email
        description: Customer email address
        data_type: varchar

      - name: country
        description: Country associated with the customer
        data_type: varchar

      - name: segment
        description: Business-defined customer segment
        data_type: varchar

      - name: signup_ts
        description: Timestamp when the customer signed up
        data_type: timestamp

      - name: first_order_ts
        description: Timestamp of the customer’s first completed order
        data_type: timestamp

      - name: lifetime_orders
        description: Total number of orders placed by the customer
        data_type: integer

      - name: lifetime_net_spend
        description: Total net revenue generated by the customer
        data_type: numeric

      - name: loyalty_tier
        description: Loyalty tier assigned based on customer lifetime value
        data_type: varchar


  - name: dim_customers_v2
    description: >
      Version 2 of the customer dimension introducing additional
      derived metrics while preserving backward compatibility.
    columns:
      - name: avg_order_value
        description: Average net spend per order for the customer
        data_type: numeric


  - name: fct_orders_daily
    description: >
      Fact table at order-day grain capturing revenue,
      discounts, net sales, and payment status for customer orders.
    config:
      contract:
        enforced: true
      on_schema_change: fail

    columns:
      - name: order_id
        description: Unique identifier for each order
        data_type: bigint
        tests:
          - not_null
          - unique

      - name: order_date
        description: Date on which the order was placed
        data_type: date

      - name: customer_id
        description: Identifier linking the order to a customer
        data_type: bigint
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: campaign_id
        description: Marketing campaign associated with the order, if applicable
        data_type: bigint

      - name: coupon_code
        description: Coupon code applied to the order
        data_type: varchar

      - name: order_status
        description: Current status of the order
        data_type: varchar

      - name: gross_revenue
        description: Total order revenue before discounts
        data_type: numeric

      - name: discount_amount
        description: Total discount applied to the order
        data_type: numeric

      - name: net_sales
        description: Net revenue after discounts
        data_type: numeric
        tests:
          - net_sales_non_negative

      - name: payment_status
        description: Indicates whether the order has been paid
        data_type: varchar


  - name: dim_products
    description: >
      Product dimension containing product attributes,
      categorization, and supplier-related information.
    columns:
      - name: product_id
        description: Unique identifier for each product
        data_type: bigint
        tests:
          - not_null
          - unique

      - name: category
        description: High-level product category used for reporting and analysis
        data_type: varchar
        tests:
          - accepted_values:
              values:
                - apparel
                - beauty
                - electronics
                - grocery
                - home
