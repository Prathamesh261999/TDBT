version: 2

models:
  - name: dim_customers
    description: Customer dimension with lifetime metrics and loyalty segmentation
    config:
      contract:
        enforced: true

    columns:
      - name: customer_id
        data_type: bigint
        tests:
          - not_null
          - unique

      - name: first_name
        data_type: varchar

      - name: last_name
        data_type: varchar

      - name: email
        data_type: varchar

      - name: country
        data_type: varchar

      - name: segment
        data_type: varchar

      - name: signup_ts
        data_type: timestamp

      - name: first_order_ts
        data_type: timestamp

      - name: lifetime_orders
        data_type: integer

      - name: lifetime_net_spend
        data_type: numeric

      - name: loyalty_tier
        data_type: varchar
      
  - name: dim_customers_v2
    description: Customer dimension v2 with average order value
    columns:
      - name: avg_order_value
        data_type: numeric

  - name: fct_orders_daily
    description: Daily order fact table with revenue and payment metrics
    config:
      contract:
        enforced: true
      on_schema_change: fail

    columns:
      - name: order_id
        data_type: bigint
        tests:
          - not_null
          - unique

      - name: order_date
        data_type: date

      - name: customer_id
        data_type: bigint
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: campaign_id
        data_type: bigint

      - name: coupon_code
        data_type: varchar

      - name: order_status
        data_type: varchar

      - name: gross_revenue
        data_type: numeric

      - name: discount_amount
        data_type: numeric

      - name: net_sales
        data_type: numeric
        tests:
          - net_sales_non_negative


      - name: payment_status
        data_type: varchar


  - name: dim_products
    description: Product dimension with category and pricing attributes
    columns:
      - name: product_id
        data_type: bigint
        tests:
          - not_null
          - unique

      - name: category
        data_type: varchar
        tests:
          - accepted_values:
              values:
                - apparel
                - beauty
                - electronics
                - grocery
                - home
